# Minimal-impact reference backend for r7 benchmarks.
#
# Design goal: be so cheap that whatever the benchmark measures is r7, not this.
#   - no disk I/O (access_log off, error_log to /dev/null)
#   - no filesystem lookups (static `return`, never `try_files`)
#   - effectively unlimited keep-alive, so connection setup never enters the loop
#   - reuseport, so each worker gets its own accept queue (no thundering herd)
#
# Each workload gets a response shaped like the real thing, with the headers such
# a response carries: an 8 KB HTML page, a 2 KB JSON resource and a 201 with a
# small JSON body. The bodies are fixed files in www/, served from the page cache
# with their descriptors cached, so the backend stays cheap. Anything else gets a
# tiny "OK", which is what the header-heavy profiling workload wants.

worker_processes  auto;
worker_rlimit_nofile 200000;

error_log /dev/null crit;
pid /tmp/nginx-bench.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    default_type text/plain;

    # The load generator holds connections open for the whole run. These two
    # directives are the difference between measuring HTTP and measuring TCP.
    keepalive_requests 100000000;
    keepalive_timeout  3600s;

    tcp_nodelay on;
    sendfile off;

    # Buffer request bodies in memory so POST bodies are discarded promptly and
    # the connection survives. Without this, nginx may lingering-close POSTs and
    # you end up benchmarking reconnects.
    client_body_buffer_size 64k;
    client_max_body_size    1m;

    server {
        listen 11111 reuseport backlog=65535;
        server_name _;

        # Health/readiness probe used by run.sh before it starts a run.
        location = /__bench_health {
            return 200 "ready\n";
        }

        # Bodies live in www/, mounted at /srv/bench. The gateway forwards the full
        # path (/bench/..., /filtered/...), so the locations match on the suffix.
        root /srv/bench;
        open_file_cache max=16 inactive=1h;
        open_file_cache_valid 1h;

        # browser: a server-rendered page.
        location ~ /app/dashboard$ {
            rewrite ^ /dashboard.html break;
            types { }
            default_type "text/html; charset=utf-8";
            add_header Cache-Control "no-cache";
            add_header Vary "Accept-Encoding";
            add_header Set-Cookie "session=f47ac10b58cc4372a5670e02b2c3d479; Path=/; Secure; HttpOnly; SameSite=Lax";
            add_header X-Content-Type-Options "nosniff";
            add_header X-Frame-Options "DENY";
        }

        # api-get: one resource.
        location ~ /api/v1/orders/[0-9]+$ {
            rewrite ^ /order.json break;
            types { }
            default_type application/json;
            add_header Cache-Control "private, no-cache";
            add_header Vary "Accept-Encoding";
            add_header X-Content-Type-Options "nosniff";
        }

        # api-post: create a resource. nginx discards the request body before it answers.
        location ~ /api/v1/orders$ {
            default_type application/json;
            add_header Location "/api/v1/orders/1234";
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff";
            return 201 '{"id":"ord_01J9Z3K7Q4M2X8B6N5T1R0VWYC","status":"received","createdAt":"2026-10-11T08:14:22Z","links":{"self":"/api/v1/orders/1234"}}';
        }

        location / {
            return 200 "OK";
        }
    }
}
