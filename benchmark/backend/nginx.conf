# Minimal-impact reference backend for r7 benchmarks.
#
# Design goal: be so cheap that whatever the benchmark measures is r7, not this.
#   - no disk I/O (access_log off, error_log to /dev/null)
#   - no filesystem lookups (static `return`, never `try_files`)
#   - effectively unlimited keep-alive, so connection setup never enters the loop
#   - reuseport, so each worker gets its own accept queue (no thundering herd)
#
# Responses are deliberately tiny and fixed-length. If you want to measure body
# copying, change BENCH_BODY_BYTES in run.sh rather than editing this file.

worker_processes  auto;
worker_rlimit_nofile 200000;

error_log /dev/null crit;
pid /tmp/nginx-bench.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;
    default_type text/plain;

    # The load generator holds connections open for the whole run. These two
    # directives are the difference between measuring HTTP and measuring TCP.
    keepalive_requests 100000000;
    keepalive_timeout  3600s;

    tcp_nodelay on;
    sendfile off;

    # Buffer request bodies in memory so POST bodies are discarded promptly and
    # the connection survives. Without this, nginx may lingering-close POSTs and
    # you end up benchmarking reconnects.
    client_body_buffer_size 64k;
    client_max_body_size    1m;

    server {
        listen 11111 reuseport backlog=65535;
        server_name _;

        # Health/readiness probe used by run.sh before it starts a run.
        location = /__bench_health {
            return 200 "ready\n";
        }

        location / {
            return 200 "OK";
        }
    }
}
