# Peer: nginx as a reverse proxy, the reference every reader knows.
#
# Rendered by run.sh: __WORKERS__ is the number of gateway CPUs, __GW_PORT__ and
# __BACKEND_PORT__ are the ports of this run. It runs on the gateway's cores, in
# front of the same backend r7 proxies to, with the settings a production proxy
# uses: HTTP/1.1 and keep-alive to the upstream, and no access log, which is what
# r7 does with the journal off.

worker_processes  __WORKERS__;
worker_rlimit_nofile 200000;

error_log /dev/null crit;
pid /tmp/nginx-peer.pid;

events {
    worker_connections 16384;
    multi_accept on;
}

http {
    access_log off;

    keepalive_requests 100000000;
    keepalive_timeout  3600s;
    tcp_nodelay on;

    # Without keep-alive to the upstream, nginx opens a connection per request and
    # the comparison measures TCP setup.
    upstream backend {
        server 127.0.0.1:__BACKEND_PORT__;
        keepalive 256;
        keepalive_requests 100000000;
        keepalive_timeout 3600s;
    }

    server {
        listen __GW_PORT__ reuseport backlog=65535;
        server_name _;
        client_max_body_size 1m;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
