name: Prune Old GHCR Images

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

# Nothing by default: each job grants only the permissions it needs.
permissions: {}

jobs:
  clean-ghcr:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Delete old images
        uses: snok/container-retention-policy@3b0972b2276b171b212f8c4efbca59ebba26eceb # v3.0.1
        with:
          image-names: r7-gateway
          cut-off: 3 days
          keep-n-most-recent: 2
          account: user
          token: ${{ secrets.GITHUB_TOKEN }}
