name: Deploy Zensical Docs
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Setup Environments
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2. Build Zensical Docs FIRST
      - name: Install Zensical
        run: pip install zensical

      - name: Build Docs
        run: zensical build

      # 3. Build the Monaco Editor
      - name: Build r7 Editor
        working-directory: ./docs/editor
        run: |
          npm install
          npm run build

      # 4. Assemble the final site safely
      - name: Copy Static Assets & Inject Editor
        run: |
          # Ensure schemas are in place
          mkdir -p ./site/schemas
          cp -r docs/schemas/* ./site/schemas/
          
          # TRAP PREVENTED: Delete the raw source files and node_modules 
          # that Zensical blindly copied into the site folder
          rm -rf ./site/editor
          
          # Inject ONLY the compiled production build into the live path
          mkdir -p ./site/editor
          cp -r ./docs/editor/dist/* ./site/editor/

      # 5. Deploy the combined output
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site