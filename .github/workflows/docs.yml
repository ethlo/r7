name: Deploy Zensical Docs
on:
  push:
    branches:
      - main

# Nothing by default: each job grants only the permissions it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 1. Setup Environments
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Must satisfy r7-editor's engines range (^20.19.0 || >=22.12.0), which
          # .npmrc enforces with engine-strict -- '20' resolves to the latest 20.x and
          # only just clears it.
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # 2. Build Zensical Docs FIRST
      # This job holds a token that can write to the repository, so nothing it installs may
      # change under it: exact versions with hashes here, the lockfile below.
      - name: Install Zensical
        run: pip install --require-hashes -r .github/docs-requirements.txt

      - name: Build Docs
        run: zensical build

      # 3. Build the Monaco Editor
      - name: Build r7 Editor
        working-directory: ./r7-editor
        run: |
          npm ci --ignore-scripts
          npm run build

      # 4. Assemble the final site safely
      - name: Copy Static Assets & Inject Editor
        run: |
          # Ensure schemas are in place
          mkdir -p ./site/schemas
          cp -r docs/schemas/* ./site/schemas/
          
          # Inject ONLY the compiled production build into the live path
          mkdir -p ./site/editor-app
          cp -r ./r7-editor/dist/* ./site/editor-app/

      # 5. Deploy the combined output
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site