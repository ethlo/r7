name: Deploy Zensical Docs
on:
  push:
    branches:
      - main

# Nothing by default: each job grants only the permissions it needs.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # 1. Setup Environments
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          # Must satisfy r7-editor's engines range (^20.19.0 || >=22.12.0), which
          # .npmrc enforces with engine-strict -- '20' resolves to the latest 20.x and
          # only just clears it.
          node-version: '22'

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # 2. Build Zensical Docs FIRST
      - name: Install Zensical
        run: pip install zensical

      - name: Build Docs
        run: zensical build

      # 3. Build the Monaco Editor
      - name: Build r7 Editor
        working-directory: ./r7-editor
        run: |
          npm install
          npm run build

      # 4. Assemble the final site safely
      - name: Copy Static Assets & Inject Editor
        run: |
          # Ensure schemas are in place
          mkdir -p ./site/schemas
          cp -r docs/schemas/* ./site/schemas/
          
          # Inject ONLY the compiled production build into the live path
          mkdir -p ./site/editor-app
          cp -r ./r7-editor/dist/* ./site/editor-app/

      # 5. Deploy the combined output
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site