name: Security scans

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    # Weekly, so advisories published after the last change are still caught
    - cron: '17 3 * * 1'
  workflow_dispatch:

# Nothing by default: each job grants only the permissions it needs.
permissions: {}

jobs:
  codeql:
    name: CodeQL (java, security-extended)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended

      - name: Build
        run: ./mvnw -B -ntp -DskipTests package

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:java-kotlin

  dependencies:
    name: Dependency vulnerabilities (OSV)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Maven resolves the full graph, transitive dependencies included. Scanning the pom files
      # directly cannot: OSV-Scanner fails to resolve the reactor's own SNAPSHOT modules and falls
      # back to direct dependencies only, which missed logback-core (transitive) entirely.
      - name: Build a CycloneDX SBOM of the runtime dependencies
        run: |
          ./mvnw -B -ntp -DskipTests install
          ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.3:makeAggregateBom -DoutputFormat=json -DincludeTestScope=false

      # Fails on any advisory not accepted, with its reason and an expiry, in osv-scanner.toml.
      - uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --config=osv-scanner.toml
            -L=target/bom.json
