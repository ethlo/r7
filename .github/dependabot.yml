# Keeps the SHA-pinned GitHub Actions, the Maven dependencies and the container base images
# current. Pins without updates would trade a moving-tag risk for a stale-version one.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      maven-minor-and-patch:
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 10

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    groups:
      base-images:
        patterns: ["*"]
