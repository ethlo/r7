version: basic-auth-fallback-test

routes:
  # The primary upstream is a closed port, so the health check marks it down and verified
  # requests fall back to WireMock - which must never receive the client's credentials.
  - id: protected
    match:
      - PathPrefix:
          prefix: /protected
    filters:
      - BasicAuth:
          users:
            # htpasswd -nbBC 4 alice secret
            - "alice:$2y$04$agcM9nDVmZGTJPT.ldejs.zoYitvQGSKw4FIG2Bt9bpsYf89eaeLG"
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:1
      health_check:
        path: /health
        interval: 200ms
        fall: 1
      fallback:
        route_id: protected-fallback

  - id: protected-fallback
    filters:
      - AddRequestHeader:
          name: X-Fallback
          value: "yes"
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}
