version: management-test

routes:
  - id: with-secrets
    match:
      - PathPrefix:
          prefix: /secrets
    filters:
      - InjectBasicAuth:
          username: upstream-svc
          password: upstream-s3cret-value
      - SetRequestHeader:
          name: Authorization
          value: Bearer header-s3cret-token
      - SetRequestHeader:
          name: Accept
          value: application/visible+json
      - SetRequestCookie:
          name: session
          value: cookie-s3cret-value
      - AddQueryParameter:
          name: api_key
          value: query-s3cret-value
      - SetResponseCookie:
          name: tracking
          value: response-cookie-s3cret
    upstream:
      targets:
        - url: http://svc-user:url-s3cret-pass@${UPSTREAM_HOST}:${WIREMOCK_PORT}
