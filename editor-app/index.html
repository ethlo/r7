<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r7 Gateway Editor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
            color: #cccccc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        #toolbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #252526;
            border-bottom: 1px solid #333333;
            padding: 0 16px;
            height: 40px;
            flex-shrink: 0;
            transition: background-color 0.2s, border-color 0.2s;
        }

        .title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .controls {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        select, button {
            background: transparent;
            border: 1px solid transparent;
            color: inherit;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 3px;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        select:hover, button:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        select:focus, button:focus {
            outline: 1px solid #007fd4;
        }

        select option {
            background: #252526;
            color: #cccccc;
        }

        /* Differentiate the danger/destructive actions slightly */
        #clear-btn:hover {
            background: rgba(218, 54, 51, 0.2);
            color: #ff6b6b;
        }

        #app {
            flex: 1;
            width: 100%;
            position: relative;
        }
    </style>
  <script type="module" crossorigin src="./assets/index-0HeD1FBz.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DsjRZPLb.css">
</head>
<body>
<div id="toolbar">
    <span class="title" id="app-title">r7 Configurator</span>
    <div class="controls">
        <select id="theme-selector" title="Editor Theme">
            <option value="vs-dark">Dark</option>
            <option value="vs">Light</option>
            <option value="hc-black">High Contrast</option>
        </select>
        <button id="clear-btn" title="Erase everything">Clear</button>
        <button id="reset-btn" title="Load default configuration">Load Example</button>
        <button id="save-btn" title="Download Configuration">Save As...</button>
    </div>
</div>
<div id="app"></div>
</body>
</html>
