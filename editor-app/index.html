<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r7 Gateway Editor</title>
    <style>
        :root {
            /* Default Dark Theme Variables */
            --bg-main: #1e1e1e;
            --bg-toolbar: #252526;
            --border-color: #333333;
            --text-main: #cccccc;
            --btn-hover: rgba(255, 255, 255, 0.1);

            --accent-blue: #555555;
            --accent-blue-hover: #777777;

            --danger-red: #da3633;
            --danger-red-hover: #b82a27;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            background-color: var(--bg-main);
            border: 1px solid var(--border-color);
            border-radius: 3px;
            margin: 0;
            cursor: pointer;
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s ease;
        }

        /* 2. Style the background when checked (using your new muted accent variable) */
        input[type="checkbox"]:checked {
            background-color: var(--accent-blue);
            border-color: var(--accent-blue);
        }

        /* 3. Draw the checkmark manually using a pseudo-element */
        input[type="checkbox"]:checked::after {
            content: "";
            width: 3px;
            height: 7px;
            border: solid #ffffff; /* Bright white checkmark for contrast */
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            position: absolute;
            top: 1px;
        }

        /* 4. Keep accessibility focus states clean */
        input[type="checkbox"]:focus-visible {
            outline: 1px solid var(--text-main);
            outline-offset: 2px;
        }

        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            background: var(--bg-main);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
            transition: background-color 0.2s, color 0.2s;
        }

        /* --- TOOLBAR --- */
        #toolbar {
            display: flex; align-items: center; justify-content: space-between;
            background-color: var(--bg-toolbar);
            border-bottom: 1px solid var(--border-color);
            padding: 0 16px;
            height: 44px; flex-shrink: 0;
            transition: background-color 0.2s, border-color 0.2s;
            position: relative; /* For dropdown positioning */
        }

        .title { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; }
        .controls { display: flex; gap: 6px; align-items: center; }

        select, button {
            background: transparent; border: 1px solid transparent; color: inherit;
            font-size: 12px; padding: 6px 10px; border-radius: 4px;
            cursor: pointer; display: flex; align-items: center; gap: 6px;
            transition: all 0.15s ease;
        }

        select { border: 1px solid var(--border-color); }
        select option { background: var(--bg-toolbar); color: var(--text-main); }

        button:hover { background: var(--btn-hover); }
        button:focus, select:focus { outline: 1px solid var(--accent-blue); }

        /* Modern icon styling */
        button svg {
            width: 16px; height: 16px;
            fill: none; stroke: currentColor;
            stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
        }

        #clear-btn:hover { background: rgba(218, 54, 51, 0.15); color: #ff6b6b; }

        /* Mobile Menu Button */
        #menu-toggle {
            display: none;
            padding: 6px;
        }

        /* --- RESPONSIVE LAYOUT --- */
        @media (max-width: 800px) {
            #menu-toggle { display: flex; }
            .controls {
                display: none; /* Hidden by default on mobile */
                flex-direction: column;
                position: absolute;
                top: 44px; right: 0;
                background: var(--bg-toolbar);
                border-left: 1px solid var(--border-color);
                border-bottom: 1px solid var(--border-color);
                padding: 12px;
                z-index: 1000;
                align-items: stretch;
                box-shadow: -4px 4px 12px rgba(0,0,0,0.3);
                border-radius: 0 0 0 6px;
            }
            .controls.open { display: flex; }
            .controls button, .controls select, .controls label {
                justify-content: flex-start;
                padding: 8px 10px;
            }
        }

        #app { flex: 1; width: 100%; position: relative; }

        /* --- CUSTOM MODAL --- */
        #modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5); backdrop-filter: blur(2px);
            display: flex; align-items: center; justify-content: center;
            z-index: 9999; opacity: 0; pointer-events: none;
            transition: opacity 0.2s ease;
        }
        #modal-overlay.active { opacity: 1; pointer-events: all; }

        .modal-box {
            background: var(--bg-toolbar);
            border: 1px solid var(--border-color);
            border-radius: 6px; padding: 20px; width: 340px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            transform: translateY(-10px); transition: transform 0.2s ease;
        }
        #modal-overlay.active .modal-box { transform: translateY(0); }

        .modal-title { margin: 0 0 10px 0; font-size: 14px; font-weight: 600; }
        .modal-message { margin: 0 0 16px 0; font-size: 13px; line-height: 1.5; opacity: 0.9; }

        .modal-input {
            width: 100%; box-sizing: border-box; padding: 8px; margin-bottom: 16px;
            background: var(--bg-main); color: var(--text-main);
            border: 1px solid var(--border-color); border-radius: 4px; font-size: 13px;
        }
        .modal-input:focus { outline: 1px solid var(--accent-blue); border-color: var(--accent-blue); }

        .modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

        /* Modal specific button overrides */
        .modal-actions button { border: 1px solid var(--border-color); padding: 6px 14px; }
        .modal-actions button.primary { background: var(--accent-blue); color: #fff; border-color: var(--accent-blue); }
        .modal-actions button.primary:hover { background: var(--accent-blue-hover); }
        .modal-actions button.danger { background: var(--danger-red); color: #fff; border-color: var(--danger-red); }
        .modal-actions button.danger:hover { background: var(--danger-red-hover); }

        .hidden { display: none !important; }
    </style>
  <script type="module" crossorigin src="./assets/index-BXGp1uXT.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-DsjRZPLb.css">
</head>
<body>
<div id="toolbar">
    <span class="title" id="app-title">r7 Configurator 2</span>

    <button id="menu-toggle" title="Toggle Menu">
        <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <div class="controls" id="toolbar-controls">
        <select id="theme-selector" title="Editor Theme">
            <option value="vs-dark">Dark</option>
            <option value="vs">Light</option>
            <option value="hc-black">High Contrast</option>
        </select>

        <button id="reset-btn" title="Load sample configuration">
            <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
            Load Example
        </button>

        <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; font-size: 12px;">
            <input type="checkbox" id="hover-toggle" checked style="margin: 0;">
            Hover info
        </label>

        <button id="fullscreen-btn" title="Toggle Fullscreen">
            <svg viewBox="0 0 24 24"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
            Fullscreen
        </button>
        <button id="clear-btn" title="Erase everything">
            <svg viewBox="0 0 24 24"><path d="M3 6h18m-2 0v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6m3 0V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2m-6 5v6m4-6v6"/></svg>
            Clear
        </button>
        <button id="save-btn" title="Download Configuration">
            <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Save As...
        </button>
    </div>
</div>

<div id="app"></div>

<div id="modal-overlay">
    <div class="modal-box">
        <h3 class="modal-title" id="modal-title">Title</h3>
        <p class="modal-message" id="modal-message">Message</p>
        <input type="text" class="modal-input hidden" id="modal-input" spellcheck="false">
        <div class="modal-actions">
            <button id="modal-cancel">Cancel</button>
            <button id="modal-confirm" class="primary">Confirm</button>
        </div>
    </div>
</div>

<script>
    document.getElementById('menu-toggle').addEventListener('click', function() {
        document.getElementById('toolbar-controls').classList.toggle('open');
    });
</script>
</body>
</html>
