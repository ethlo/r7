version: unrouted-journal-test

unrouted:
  journal:
    request:
      level: HEADERS
    response:
      level: METADATA

routes:
  # Journaled, for the upstream timings.
  - id: timed
    match:
      - PathPrefix:
          prefix: /timed
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}
    journal:
      request:
        level: METADATA
      response:
        level: METADATA

  - id: known
    match:
      - PathPrefix:
          prefix: /known
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}

  # Catastrophic on an X-Evil header, and cheap for every request without one: exhausting the
  # regex budget while matching is a refusal before routing.
  - id: evil
    match:
      - MatchRequestHeader:
          name: X-Evil
          regexp: "^(.*a){12}$"
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}
