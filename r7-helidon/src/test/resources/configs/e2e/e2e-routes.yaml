filters:
  - SimpleMetrics

routes:
  - id: static-test
    match:
      - PathPrefix:
          prefix: /static/
    filters:
      - StripPathPrefix:
          parts: 1
      - StaticContent:
          directories: [/tmp]

  - id: static-swap-test
    match:
      - PathPrefix:
          prefix: /static-swap/
    filters:
      - StripPathPrefix:
          parts: 1
      - StaticContent:
          directories: [/tmp/static-swap-test/current]

  - id: static-symlink-blocked-test
    match:
      - PathPrefix:
          prefix: /static-symlink-blocked/
    filters:
      - StripPathPrefix:
          parts: 1
      - StaticContent:
          directories: [/tmp/static-symlink-test]

  - id: static-symlink-followed-test
    match:
      - PathPrefix:
          prefix: /static-symlink-followed/
    filters:
      - StripPathPrefix:
          parts: 1
      - StaticContent:
          directories: [/tmp/static-symlink-test]
          follow_symlinks: true

  - id: static-no-welcome-test
    match:
      - PathPrefix:
          prefix: /static-no-welcome/
    filters:
      - StripPathPrefix:
          parts: 1
      - StaticContent:
          directories: [/tmp/static-no-welcome-test]

  - id: query-modify-test
    match:
      - PathPrefix:
          prefix: /query-modify
    filters:
      - AddQueryParameter:
          name: added_q
          value: injected_value
      - RemoveQueryParameter:
          name: removed_q
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}

  - id: cookie-modify-test
    match:
      - PathPrefix:
          prefix: /cookie-modify
    filters:
      - SetRequestCookie:
          name: added_c
          value: injected_cookie
      - RemoveRequestCookie:
          name: removed_c
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}

  # Primary upstream is a closed port, so the health check marks it down and requests fall
  # back. The fallback upstream is WireMock, which must never see the primary's credentials.
  - id: fallback-primary-test
    match:
      - PathPrefix:
          prefix: /fallback-primary
    filters:
      - InjectBasicAuth:
          username: primary-only
          password: primary-secret
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:1
      health_check:
        path: /health
        interval: 200ms
        fall: 1
      fallback:
        route_id: fallback-target-test

  - id: fallback-target-test
    match: []
    filters:
      - AddRequestHeader:
          name: X-Fallback-Route
          value: applied
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}

  - id: strip-prefix-encoding-test
    match:
      - PathPrefix:
          prefix: /strip-encoding/
    filters:
      - StripPathPrefix:
          parts: 1
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}

  - id: e2e-passthrough
    match:
      - PathPrefix:
          prefix: /
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}/
