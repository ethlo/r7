version: journal-rules-test

journal:
  request:
    level: HEADERS
  response:
    level: METADATA
  on_response:
    # Both directions to NONE: the 404 must leave no entry at all.
    - id: drop-misses
      match:
        - Status:
            include: [404]
      request: { level: NONE }
      response: { level: NONE }
    # Raised at commit: the body is captured from its first byte.
    - id: keep-bodies
      match:
        - Status:
            include: [201, 202]
      response: { level: FULL }

routes:
  - id: missing
    match:
      - PathPrefix:
          prefix: /missed
    filters:
      - ReturnResponse:
          status: 404
          body: missed
  - id: traced
    match:
      - PathPrefix:
          prefix: /traced
    filters:
      - ReturnResponse:
          status: 200
          body: traced
  - id: answered
    match:
      - PathPrefix:
          prefix: /answered
    filters:
      - ReturnResponse:
          status: 201
          body: answered by r7
  - id: proxied
    match:
      - PathPrefix:
          prefix: /proxied
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}
  # Rules see the request as the client sent it, never what the filters made of it.
  - id: rewritten
    match:
      - PathPrefix:
          prefix: /rewritten/
    filters:
      - RewritePath:
          regexp: /rewritten/(.*)
          replacement: /upstream/$1
      - SetRequestHeader:
          name: x-stage
          value: rewritten
    upstream:
      targets:
        - url: http://${UPSTREAM_HOST}:${WIREMOCK_PORT}
    journal:
      request: { level: METADATA }
      on_request:
        - id: client-path
          match:
            - PathPrefix:
                prefix: /rewritten/
            - not:
                HasRequestHeader:
                  name: x-stage
          request: { level: HEADERS }
      on_response:
        # Checked first: it would win if the client leg saw the rewritten path.
        - id: rewritten-path-on-client-leg
          match:
            - PathPrefix:
                prefix: /upstream/
          response: { level: FULL }
        - id: client-request
          match:
            - PathPrefix:
                prefix: /rewritten/
            - not:
                HasRequestHeader:
                  name: x-stage
          response: { level: HEADERS }
