version: my-version-4.1
filters:
  - SimpleMetrics
  - AddCorrelationId
routes:
  - id: reject-benchmark
    upstream:
      targets:
        - url: http://localhost:1111
    match:
      - PathPrefix:
          prefix: /benchmark
    filters:
      - RequireRequestHeader:
          name: Authorization
          reject_status_code: 401

  - id: internal-backend
    match:
      - PathPrefix:
          prefix: /hello
      - Method:
          include:
            - GET
            - POST
    upstream:
      targets:
        - url: http://localhost:1111
    filters:
      - RateLimiter:
          capacity: 5
          refill_tokens: 1
          refill_period: 2s
      - CircuitBreaker:
          failure_threshold: 10
          cooldown_period: 12s
      - AddResponseHeader:
          name: X-Powered-By
          value: Ethlo R7
      - AddCorrelationId
    journal:
      on_response:
        - match:
            - Status:
                include: [401, 403, 5xx]
          request: { level: HEADERS }
        - match:
            - Status:
                include: [429]
          request: { level: METADATA }

  - id: ws-test
    upstream:
      targets:
        - url: http://127.0.0.1:8080
    match:
      - PathPrefix:
          prefix: /ws
    journal:
      request:
        level: METADATA
      response:
        level: HEADERS
      on_response:
        - match:
            - Status:
                include: [5xx]
          request: { level: HEADERS }
        - match:
            - Status:
                include: [2xx]
          response: { level: NONE }
