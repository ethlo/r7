$schema: http://json-schema.org/draft-07/schema#
type: object
title: r7 Gateway Configuration
properties:
  filters:
    type: array
    items:
      $ref: "#/definitions/filter"

definitions:
  filter:
    # THE MAGIC FIX: Declare multiple types at the root, removing anyOf entirely.
    type: ["object", "string"]
    properties:
      AddQueryParameter:
        type: object
        description: "SUCCESS! Hover is working for AddQueryParameter."
        properties:
          name:
            type: string
            description: "The name of the parameter"
          value:
            type: string
            description: "The value of the parameter"
        required: [name, value]
        defaultSnippets:
          - label: "Insert AddQueryParameter"
            body:
              name: "$1"
              value: "$2"