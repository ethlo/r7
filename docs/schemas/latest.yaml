          description: Matches if the request path starts with the provided prefix.
          defaultSnippets:
          - label: Insert PathPrefix
            description: Matches if the request path starts with the provided prefix.
            body:
              prefix: $1
        QueryParameter:
          type: object
          properties:
            leg:
              type: string
              enum:
              - client
              description: "Which leg of the exchange to test: only client exists here; upstream only in on_response."
            name:
              type: string
              description: The name of the query parameter.
            value:
              type: string
              description: The exact value the query parameter must hold.
          required:
          - name
          - value
          additionalProperties: false
          description: Matches if the request contains the specified query parameter with an exact value.
          defaultSnippets:
          - label: Insert QueryParameter
            description: Matches if the request contains the specified query parameter with an exact value.
            body:
              name: $1
              value: $2
        RemoteAddr:
          type: object
          properties:
            leg:
              type: string
              enum:
              - client
              description: "Which leg of the exchange to test: only client exists here; upstream only in on_response."
            source:
              type: string
              description: "The IP or CIDR range to match (e.g., 192.168.1.0/24)."
          required:
          - source
          additionalProperties: false
          description: Matches if the remote IP address falls within the specified CIDR range.
          defaultSnippets:
          - label: Insert RemoteAddr
            description: Matches if the remote IP address falls within the specified CIDR range.
            body:
              source: $1
        RequestHeader:
          type: object
          properties:
            leg:
              type: string
              enum:
              - client
              description: "Which leg of the exchange to test: only client exists here; upstream only in on_response."
            name:
              type: string
              description: The name of the request header.
            value:
              type: string
              description: The exact value the header must hold.
          required:
          - name
          - value
          additionalProperties: false
          description: Matches if the request contains the specified header with an exact value.
          defaultSnippets:
          - label: Insert RequestHeader
            description: Matches if the request contains the specified header with an exact value.
            body:
              name: $1
              value: $2
        Sample:
          type: object
          properties:
            rate:
              anyOf:
              - type: number
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "The share of exchanges to match: greater than 0, at most 1 (0.01 is one in a hundred)."
          required:
          - rate
          additionalProperties: false
          description: "Matches a share of exchanges, drawn once per exchange from a random source."
        UnroutedReason:
          type: object
          properties:
            include:
              type: array
              items:
                type: string
                enum:
                - no_route
                - trace
                - ambiguous_path
                - transfer_encoding
                - regex_budget
              description: "The reasons to match: no_route (404), trace (501), ambiguous_path (400), transfer_encoding (400), regex_budget (500)."
              minItems: 1
          required:
          - include
          additionalProperties: false
          description: Matches requests refused before routing for one of these reasons. Only under unrouted.
        and:
          type: array
          items:
            $ref: "#/$defs/unroutedPredicate"
          minItems: 1
        not:
          $ref: "#/$defs/unroutedPredicate"
        or:
          type: array
          items:
            $ref: "#/$defs/unroutedPredicate"
          minItems: 1
      additionalProperties: true
      minProperties: 1
      maxProperties: 1
    - type: string
      description: Custom SPI implementation
properties:
  filters:
    type: array
    items:
      $ref: "#/$defs/rootFilter"
    description: "Filters for every route: one instance each for the whole gateway. They run before a group's and a route's on the request, and after them on the response."
  journal:
    type: object
    properties:
      on_request:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: "A label, unique among all rules in the file, journaled in gateway.journal.rule in place of the rule's path when it fires."
            match:
              type: array
              items:
                $ref: "#/$defs/predicate"
              description: Conditions that must all hold for the rule to fire.
              minItems: 1
            request:
              type: object
              properties:
                level:
                  type: string
                  enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                  description: The journaling verbosity level.
                truncate_body_at:
                  type: string
                  pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
                  errorMessage:
                    pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
                  description: "At FULL, the journal keeps the body's first truncate_body_at bytes and records that it stopped. The body still streams whole. Ignored below FULL. (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
              additionalProperties: false
              minProperties: 1
              description: Journal settings for this direction of the exchange.
            response:
              type: object
              properties:
                level:
                  type: string
                  enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                  description: The journaling verbosity level.
                truncate_body_at:
                  type: string
                  pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
                  errorMessage:
                    pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
                  description: "At FULL, the journal keeps the body's first truncate_body_at bytes and records that it stopped. The body still streams whole. Ignored below FULL. (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
              additionalProperties: false
              minProperties: 1
              description: Journal settings for this direction of the exchange.
          required:
          - match
          additionalProperties: false
          anyOf:
          - required:
            - request
          - required:
            - response
          description: "When match holds, the directions named here replace the levels resolved so far."
        description: "Rules checked once the route is chosen, before its filters run: the client request as sent. Per direction, the first matching rule naming it wins; a route's rules are checked before its group's, then the root's."
      on_response:
        type: array
        items:
          type: object
          properties:
            id:
              type: string
              description: "A label, unique among all rules in the file, journaled in gateway.journal.rule in place of the rule's path when it fires."
            match:
              type: array
              items:
                $ref: "#/$defs/responsePredicate"
              description: Conditions that must all hold for the rule to fire.
              minItems: 1
            request:
              type: object
              properties:
                level:
                  type: string
                  enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  description: "The journaling verbosity level. FULL cannot be set once the response is decided: the request body has already streamed."
              additionalProperties: false
              minProperties: 1
              description: Journal settings for this direction of the exchange.
            response:
              type: object
              properties:
                level:
                  type: string
                  enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                  description: The journaling verbosity level.
                truncate_body_at:
                  type: string
                  pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
                  errorMessage:
                    pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
                  description: "At FULL, the journal keeps the body's first truncate_body_at bytes and records that it stopped. The body still streams whole. Ignored below FULL. (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
              additionalProperties: false
              minProperties: 1
              description: Journal settings for this direction of the exchange.
          required:
          - match
          additionalProperties: false
          anyOf:
          - required:
            - request
          - required:
            - response
          description: "When match holds, the directions named here replace the levels resolved so far."
        description: "Rules checked once the response head is final, before it is written; they override what on_request resolved. A request level that is or can become FULL cannot be changed here."
      request:
        type: object
        properties:
          level:
            type: string
            enum:
            - NONE
            - HEADERS
            - METADATA
            - FULL
            description: The journaling verbosity level.
          truncate_body_at:
            type: string
            pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
            description: "At FULL, the journal keeps the body's first truncate_body_at bytes and records that it stopped. The body still streams whole. Ignored below FULL. (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
        additionalProperties: false
        minProperties: 1
        description: Journal settings for this direction of the exchange.
      response:
        type: object
        properties:
          level:
            type: string
            enum:
            - NONE
            - HEADERS
            - METADATA
            - FULL
            description: The journaling verbosity level.
          truncate_body_at:
            type: string
            pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
            description: "At FULL, the journal keeps the body's first truncate_body_at bytes and records that it stopped. The body still streams whole. Ignored below FULL. (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
        additionalProperties: false
        minProperties: 1
        description: Journal settings for this direction of the exchange.
    additionalProperties: false
    description: "Journal levels every route inherits, each unless its group or the route names it, and rules checked after theirs. A route nothing names is journaled at NONE."
  routes:
    type: array
    items:
      oneOf:
      - $ref: "#/$defs/route"
      - $ref: "#/$defs/group"
    description: "The routing table, tried in order: routes (id) and groups of routes (group). The first route that matches takes the request."
  unrouted:
    type: object
    properties:
      journal:
        type: object
        properties:
          on_request:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "A label, unique among all rules in the file, journaled in gateway.journal.rule in place of the rule's path when it fires."
                match:
                  type: array
                  items:
                    $ref: "#/$defs/unroutedPredicate"
                  description: Conditions that must all hold for the rule to fire.
                  minItems: 1
                request:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - NONE
                      - HEADERS
                      - METADATA
                      description: The journaling verbosity level.
                  additionalProperties: false
                  minProperties: 1
                  description: Journal settings for this direction of the exchange.
                response:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - NONE
                      - HEADERS
                      - METADATA
                      description: The journaling verbosity level.
                  additionalProperties: false
                  minProperties: 1
                  description: Journal settings for this direction of the exchange.
              required:
              - match
              additionalProperties: false
              anyOf:
              - required:
                - request
              - required:
                - response
              description: "When match holds, the directions named here replace the levels resolved so far."
            description: "Rules checked on every refusal. Per direction, the first matching rule naming it wins. A rule that tests the request anywhere in its match is checked only on no_route; one made only of UnroutedReason and Sample is checked on every refusal."
          request:
            type: object
            properties:
              level:
                type: string
                enum:
                - NONE
                - HEADERS
                - METADATA
                description: The journaling verbosity level.
            additionalProperties: false
            minProperties: 1
            description: Journal settings for this direction of the exchange.
          response:
            type: object
            properties:
              level:
                type: string
                enum:
                - NONE
                - HEADERS
                - METADATA
                description: The journaling verbosity level.
            additionalProperties: false
            minProperties: 1
            description: Journal settings for this direction of the exchange.
        additionalProperties: false
        description: Journal levels and on_request rules for requests refused before any route is chosen. Not inherited from the root journal. FULL is not allowed.
    required:
    - journal
    additionalProperties: false
    description: "Journaling for requests refused before routing (no route, ambiguous path, bad Transfer-Encoding, TRACE, regex budget), recorded under route ID <unrouted>."
  upstream:
    type: object
    properties:
      fallback:
        type: object
        properties:
          route_id:
            type: string
            description: The ID of another route to execute if this upstream becomes completely unavailable.
        required:
        - route_id
        additionalProperties: false
      health_check:
        type: object
        properties:
          fall:
            anyOf:
            - type: integer
            - type: string
              pattern: "^\\$\\{.*\\}$"
            description: Number of consecutive failures required to mark target down
            default: 2
          interval:
            type: string
            pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
            description: "Interval between health checks (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            default: 10s
          override:
            anyOf:
            - type: string
              enum:
              - NONE
              - FORCE_UP
              - FORCE_DOWN
            - type: string
              pattern: "^\\$\\{.*\\}$"
            description: Force state override for targets
            default: NONE
          path:
            type: string
            pattern: "^(?:/.*|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Must match expected format or be a placeholder ${...}"
            description: "The URI path used to check the health of the target (e.g., /health)."
            default: /health
          rise:
            anyOf:
            - type: integer
            - type: string
              pattern: "^\\$\\{.*\\}$"
            description: Number of consecutive successes required to mark target up
            default: 2
        additionalProperties: false
      preserve_host:
        anyOf:
        - type: boolean
        - type: string
          pattern: "^\\$\\{.*\\}$"
        description: Send the client's Host header to the target instead of the target's own. TLS server name indication and certificate checks still use the target's host.
        default: false
      strategy:
        anyOf:
        - type: string
          enum:
          - ROUND_ROBIN
        - type: string
          pattern: "^\\$\\{.*\\}$"
        description: How requests are spread across the healthy targets.
        default: ROUND_ROBIN
      targets:
        type: array
        items:
          type: object
          properties:
            url:
              type: string
              pattern: "^(?:https?://.*|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Must match expected format or be a placeholder ${...}"
              description: The target URL (Must start with http:// or https://).
          required:
          - url
          additionalProperties: false
        description: "List of backend servers to forward traffic to. Required after inheritance: a route takes it from its group or the root when it names none."
      timeouts:
        type: object
        properties:
          connect:
            type: string
            pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
            description: "Maximum time to wait for a connection to a target, including the TLS handshake for https targets. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            default: 5s
          read:
            type: string
            pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
            errorMessage:
              pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
            description: "Maximum time to wait for a response after sending the request. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            default: 30s
        additionalProperties: false
    additionalProperties: false
    description: "Upstream keys every route inherits, each unless its group or the route names it."
  version:
    type: string
    description: "A version label for this file, logged with the file's source digest on every load and shown by the management API."
