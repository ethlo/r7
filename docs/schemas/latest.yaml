$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: r7 Gateway Configuration
$defs:
  filter:
    anyOf:
    - type: object
      properties:
        AddCorrelationId:
          type: object
          properties:
            trust_incoming:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "Whether an incoming X-Correlation-Id from the client is kept instead of being replaced. Off by default: the header is client-controlled, so trusting it lets a client plant an arbitrary value in upstream logs and tracing under this gateway's name."
              default: false
          additionalProperties: false
          description: Adds a unique correlation ID header to upstream requests and client responses for request tracing.
        AddQueryParameter:
          type: object
          properties:
            name:
              type: string
              description: The name of the query parameter.
            value:
              type: string
              description: The value to assign to the query parameter.
          required:
          - name
          - value
          additionalProperties: false
          description: Injects a static query parameter into the upstream request URL.
          defaultSnippets:
          - label: Insert AddQueryParameter
            description: Injects a static query parameter into the upstream request URL.
            body:
              name: $1
              value: $2
        AddRequestHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header.
            value:
              type: string
              description: The value of the header.
          required:
          - name
          - value
          additionalProperties: false
          description: Adds a custom header to the upstream request.
          defaultSnippets:
          - label: Insert AddRequestHeader
            description: Adds a custom header to the upstream request.
            body:
              name: $1
              value: $2
        AddResponseHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header.
            value:
              type: string
              description: The value of the header.
          required:
          - name
          - value
          additionalProperties: false
          description: Adds a custom header to the client response.
          defaultSnippets:
          - label: Insert AddResponseHeader
            description: Adds a custom header to the client response.
            body:
              name: $1
              value: $2
        BasicAuth:
          type: object
          properties:
            forward_credentials:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "Whether the client's own Authorization header is passed on to the upstream after it has been verified. Off by default: the credentials are the gateway's to check, and forwarding them hands every client password to the upstream. A header set by another filter, such as InjectBasicAuth, is never removed."
              default: false
            realm:
              type: string
              description: The authentication realm presented to the client.
            users:
              type: array
              items:
                type: string
              description: "List of users in htpasswd format (username:bcrypt-hash), as produced by 'htpasswd -B'."
          required:
          - users
          additionalProperties: false
          description: Rejects requests that do not present valid Basic Authentication credentials.
          defaultSnippets:
          - label: Insert BasicAuth
            description: Rejects requests that do not present valid Basic Authentication credentials.
            body:
              users: $1
        CircuitBreaker:
          type: object
          properties:
            cooldown_period:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "The duration the circuit remains open before attempting to close. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            failure_threshold:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The number of consecutive failures before the circuit opens.
            slow_call:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "An upstream response head that arrives later than this after the request was forwarded counts as a failure, whatever its status and whether or not the client waited. Without it, slowness counts only through the read timeout. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
          required:
          - failure_threshold
          - cooldown_period
          additionalProperties: false
          description: "Stops forwarding traffic to a failing upstream until it recovers. Judges each exchange by how its upstream fared, once the exchange is over."
          defaultSnippets:
          - label: Insert CircuitBreaker
            description: "Stops forwarding traffic to a failing upstream until it recovers. Judges each exchange by how its upstream fared, once the exchange is over."
            body:
              failure_threshold: $1
              cooldown_period: $2
        Cors:
          type: object
          properties:
            allow_credentials:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: Whether credentials are allowed. Defaults to false.
              default: false
            allowed_headers:
              type: array
              items:
                type: string
              description: List of allowed headers.
            allowed_methods:
              type: array
              items:
                type: string
              description: List of allowed methods.
            allowed_origins:
              type: array
              items:
                type: string
              description: List of allowed origins.
            max_age:
              type: string
              description: The max age for preflight caching. Defaults to 1800 seconds (30 minutes).
              default: 30m
          required:
          - allowed_origins
          - allowed_methods
          - allowed_headers
          additionalProperties: false
          description: Handles Cross-Origin Resource Sharing (CORS) preflight and response headers.
          defaultSnippets:
          - label: Insert Cors
            description: Handles Cross-Origin Resource Sharing (CORS) preflight and response headers.
            body:
              allowed_origins: $1
              allowed_methods: $2
              allowed_headers: $3
        InjectBasicAuth:
          type: object
          properties:
            password:
              type: string
              description: The password for Basic Auth.
            username:
              type: string
              description: The username for Basic Auth.
          required:
          - username
          - password
          additionalProperties: false
          description: Injects a Basic Authentication header into the upstream request.
          defaultSnippets:
          - label: Insert InjectBasicAuth
            description: Injects a Basic Authentication header into the upstream request.
            body:
              username: $1
              password: $2
        RateLimiter:
          type: object
          properties:
            capacity:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The maximum number of tokens the bucket can hold. This defines the absolute burst limit.
            ipv6_prefix_length:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "How many leading bits of an IPv6 client address identify one client. A single subscriber is typically assigned a whole /64 and can use any address in it, so limiting per full address lets one client take as many buckets as it likes."
              default: 64
            max_bucket_ttl:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "How long a bucket remains in memory after its last access before being purged. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
              default: 10m
            max_buckets:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The maximum number of distinct client buckets to track in memory. Limits memory consumption under heavy load.
              default: 100000
            refill_period:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "The time interval between token refills (e.g., 1s, 500ms). (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            refill_tokens:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The number of tokens added to the bucket at the end of every refill period.
          required:
          - capacity
          - refill_tokens
          - refill_period
          additionalProperties: false
          description: Local rate-limiter useful for avoiding overload by demanding users
          defaultSnippets:
          - label: Insert RateLimiter
            description: Local rate-limiter useful for avoiding overload by demanding users
            body:
              capacity: $1
              refill_tokens: $2
              refill_period: $3
        RemoveQueryParameter:
          type: object
          properties:
            name:
              type: string
              description: The name of the query parameter to remove.
          required:
          - name
          additionalProperties: false
          description: Removes a specific query parameter from the upstream request.
          defaultSnippets:
          - label: Insert RemoveQueryParameter
            description: Removes a specific query parameter from the upstream request.
            body:
              name: $1
        RemoveRequestCookie:
          type: object
          properties:
            name:
              type: string
              description: The name of the cookie to remove.
          required:
          - name
          additionalProperties: false
          description: Removes a specific cookie from the upstream request.
          defaultSnippets:
          - label: Insert RemoveRequestCookie
            description: Removes a specific cookie from the upstream request.
            body:
              name: $1
        RemoveRequestHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header to remove.
          required:
          - name
          additionalProperties: false
          description: Removes a specific header from the upstream request.
          defaultSnippets:
          - label: Insert RemoveRequestHeader
            description: Removes a specific header from the upstream request.
            body:
              name: $1
        RemoveResponseHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header to remove.
          required:
          - name
          additionalProperties: false
          description: Removes a specific header from the client response.
          defaultSnippets:
          - label: Insert RemoveResponseHeader
            description: Removes a specific header from the client response.
            body:
              name: $1
        RequestSizeLimit:
          type: object
          properties:
            max_size:
              type: string
              pattern: "^(?:[0-9]+([bB]|[kKmMgG][bB])?|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...}"
              description: "The maximum allowed payload size (e.g., 10MB, 1GB). (Format: <number>[unit] (e.g., 1024, 10KB, 200MB) or a placeholder ${...})"
          required:
          - max_size
          additionalProperties: false
          description: Rejects requests that exceed a specified payload size.
          defaultSnippets:
          - label: Insert RequestSizeLimit
            description: Rejects requests that exceed a specified payload size.
            body:
              max_size: $1
        RequireCookie:
          type: object
          properties:
            name:
              type: string
              description: The name of the required cookie.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the cookie is missing.
              default: 400
          required:
          - name
          additionalProperties: false
          description: Ensures a required cookie is present in the request.
          defaultSnippets:
          - label: Insert RequireCookie
            description: Ensures a required cookie is present in the request.
            body:
              name: $1
        RequireMatchCookie:
          type: object
          properties:
            name:
              type: string
              description: The name of the cookie.
            regexp:
              type: string
              description: The regular expression pattern the cookie value must match.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the cookie is missing or invalid.
              default: 400
          required:
          - name
          - regexp
          additionalProperties: false
          description: Ensures a required cookie exists and matches a specific regular expression.
          defaultSnippets:
          - label: Insert RequireMatchCookie
            description: Ensures a required cookie exists and matches a specific regular expression.
            body:
              name: $1
              regexp: $2
        RequireMatchQueryParameter:
          type: object
          properties:
            name:
              type: string
              description: The name of the query parameter.
            regexp:
              type: string
              description: The regular expression pattern the query parameter value must match.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the parameter is missing or invalid.
              default: 400
          required:
          - name
          - regexp
          additionalProperties: false
          description: Ensures a required query parameter exists and matches a specific regular expression.
          defaultSnippets:
          - label: Insert RequireMatchQueryParameter
            description: Ensures a required query parameter exists and matches a specific regular expression.
            body:
              name: $1
              regexp: $2
        RequireMatchRequestHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header.
            regexp:
              type: string
              description: The regular expression pattern the header value must match.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the header is missing or invalid.
              default: 400
          required:
          - name
          - regexp
          additionalProperties: false
          description: Ensures a required request header exists and matches a specific regular expression.
          defaultSnippets:
          - label: Insert RequireMatchRequestHeader
            description: Ensures a required request header exists and matches a specific regular expression.
            body:
              name: $1
              regexp: $2
        RequireQueryParameter:
          type: object
          properties:
            name:
              type: string
              description: The name of the required query parameter.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the parameter is missing.
              default: 400
          required:
          - name
          additionalProperties: false
          description: Ensures a required query parameter is present in the request.
          defaultSnippets:
          - label: Insert RequireQueryParameter
            description: Ensures a required query parameter is present in the request.
            body:
              name: $1
        RequireRequestHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the required header.
            reject_status_code:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return if the header is missing.
              default: 400
          required:
          - name
          additionalProperties: false
          description: Ensures a required header is present in the request.
          defaultSnippets:
          - label: Insert RequireRequestHeader
            description: Ensures a required header is present in the request.
            body:
              name: $1
        ReturnResponse:
          type: object
          properties:
            body:
              type: string
              description: The body content of the response.
            content_type:
              type: string
              description: The Content-Type of the response body.
              default: text/plain; charset=utf-8
            status:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to return.
          required:
          - status
          - body
          additionalProperties: false
          description: Immediately terminates the request chain and returns a custom response.
          defaultSnippets:
          - label: Insert ReturnResponse
            description: Immediately terminates the request chain and returns a custom response.
            body:
              status: $1
              body: $2
        RewritePath:
          type: object
          properties:
            regexp:
              type: string
              description: The regular expression to match against the path.
            replacement:
              type: string
              description: "The replacement: $1 for a numbered group, {name} for a named one, {query.NAME} for a query parameter of the request. A literal ? starts the query the upstream receives, whose parameters each need a name and whose captures and query values must be parameter values. \\{, \\?, \\& and \\= are literal characters."
          required:
          - regexp
          - replacement
          additionalProperties: false
          description: Rewrites the request path using a regular expression replacement.
          defaultSnippets:
          - label: Insert RewritePath
            description: Rewrites the request path using a regular expression replacement.
            body:
              regexp: $1
              replacement: $2
        SetQueryParameter:
          type: object
          properties:
            name:
              type: string
              description: The name of the query parameter.
            value:
              type: string
              description: The value to set.
          required:
          - name
          - value
          additionalProperties: false
          description: Sets (or overwrites) a query parameter in the upstream request.
          defaultSnippets:
          - label: Insert SetQueryParameter
            description: Sets (or overwrites) a query parameter in the upstream request.
            body:
              name: $1
              value: $2
        SetRequestCookie:
          type: object
          properties:
            name:
              type: string
              description: The name of the cookie.
            value:
              type: string
              description: The value of the cookie.
          required:
          - name
          - value
          additionalProperties: false
          description: Sets a cookie on the upstream request.
          defaultSnippets:
          - label: Insert SetRequestCookie
            description: Sets a cookie on the upstream request.
            body:
              name: $1
              value: $2
        SetRequestHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header.
            value:
              type: string
              description: The value to set.
          required:
          - name
          - value
          additionalProperties: false
          description: Sets (or overwrites) a header in the upstream request.
          defaultSnippets:
          - label: Insert SetRequestHeader
            description: Sets (or overwrites) a header in the upstream request.
            body:
              name: $1
              value: $2
        SetResponseCookie:
          type: object
          properties:
            domain:
              type: string
              description: The cookie domain.
            http_only:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: Whether client-side script is denied access to the cookie. Defaults to true.
              default: true
            max_age:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "The cookie max-age duration. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
            name:
              type: string
              description: The cookie name.
            path:
              type: string
              description: The cookie path.
            same_site:
              type: string
              description: "The SameSite policy (Strict, Lax, None). Defaults to Lax."
              default: Lax
            secure:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: Whether the cookie is sent over HTTPS only. Defaults to true.
              default: true
            value:
              type: string
              description: The cookie value.
          required:
          - name
          - value
          additionalProperties: false
          description: Sets a Set-Cookie header on the client response.
          defaultSnippets:
          - label: Insert SetResponseCookie
            description: Sets a Set-Cookie header on the client response.
            body:
              name: $1
              value: $2
        SetResponseHeader:
          type: object
          properties:
            name:
              type: string
              description: The name of the header.
            value:
              type: string
              description: The value to set.
          required:
          - name
          - value
          additionalProperties: false
          description: Sets (or overwrites) a header in the client response.
          defaultSnippets:
          - label: Insert SetResponseHeader
            description: Sets (or overwrites) a header in the client response.
            body:
              name: $1
              value: $2
        SetStatus:
          type: object
          properties:
            status:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The HTTP status code to set (100-599).
          required:
          - status
          additionalProperties: false
          description: Overwrites the HTTP status code of the client response.
          defaultSnippets:
          - label: Insert SetStatus
            description: Overwrites the HTTP status code of the client response.
            body:
              status: $1
        SimpleMetrics:
          type: object
          properties:
            interval:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
            period:
              type: string
              pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
              errorMessage:
                pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
              description: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
          required:
          - period
          - interval
          additionalProperties: false
          defaultSnippets:
          - label: Insert SimpleMetrics
            description: Configure SimpleMetrics
            body:
              period: $1
              interval: $2
        StaticContent:
          type: object
          properties:
            base_directory:
              type: string
              description: The absolute path to the directory containing static files.
            follow_symlinks:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "Whether to follow symbolic links when resolving files under the base directory. Enable this if the base directory itself, or files/directories within it, are symlinks (e.g. an atomically swapped 'current' release symlink)."
              default: false
            list_directory:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "Whether to render an HTML directory listing when a request resolves to a directory and no welcome file (e.g. index.html) is found there. Disabled by default, in which case such a request is rejected with 403 Forbidden."
              default: false
            serve_hidden_files:
              anyOf:
              - type: boolean
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "Whether to serve files and directories whose name starts with '.' (e.g. .env, .git/). Disabled by default, in which case such a request is answered 404; .well-known/ is always served."
              default: false
          required:
          - base_directory
          additionalProperties: false
          description: Serves static files from a local directory.
          defaultSnippets:
          - label: Insert StaticContent
            description: Serves static files from a local directory.
            body:
              base_directory: $1
        StripPathPrefix:
          type: object
          properties:
            parts:
              anyOf:
              - type: integer
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: The number of path segments to strip from the beginning of the path.
          required:
          - parts
          additionalProperties: false
          description: Removes a specified number of leading path segments from the request path before forwarding to the upstream service.
          defaultSnippets:
          - label: Insert StripPathPrefix
            description: Removes a specified number of leading path segments from the request path before forwarding to the upstream service.
            body:
              parts: $1
        TemplateRedirect:
          type: object
          properties:
            source:
              type: string
              description: "The regular expression pattern to match against the request path. Left out, the filter answers every request it sees, and the target can use only {query.NAME} placeholders."
            status:
              anyOf:
              - type: integer
                minimum: 100
                maximum: 599
              - type: string
                pattern: "^\\$\\{.*\\}$"
              description: "The HTTP status code to return for the redirect: 301, 302, 303, 307 or 308."
              default: 302
            target:
              type: string
              description: "The template for the target URL (e.g., /new/$1). A numbered group is $1, a named group {name} and the value of a query parameter {query.NAME}. \\{ is a literal brace."
          required:
          - target
          additionalProperties: false
          description: Redirects requests based on a path pattern match using a template for the target URL.
          defaultSnippets:
          - label: Insert TemplateRedirect
            description: Redirects requests based on a path pattern match using a template for the target URL.
            body:
              target: $1
      additionalProperties: true
      minProperties: 1
      maxProperties: 1
    - type: string
      enum:
      - RemoveCacheHeaders
      - RequireAuthorizationHeader
    - type: string
      description: Custom SPI implementation
  group:
    type: object
    properties:
      filters:
        type: array
        items:
          $ref: "#/$defs/groupFilter"
        description: "Filters for every route of the group: one instance each for the group. They run after the root's and before a route's own on the request."
      group:
        type: string
        description: "A unique identifier for this group, in one namespace with route ids. Journaled as gateway.route.group for each of its routes."
      journal:
        type: object
        properties:
          on_request:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  description: "A label, unique among all rules in the file, journaled in gateway.journal.rule in place of the rule's path when it fires."
                match:
                  type: array
                  items:
                    $ref: "#/$defs/predicate"
