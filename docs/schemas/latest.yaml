        type: array
        items:
          $ref: "#/$defs/predicate"
        description: "Conditions that must be met for this route to handle a request. Required; an empty list (match: []) matches nothing, for a route reached only as a fallback."
      upstream:
        type: object
        properties:
          fallback:
            type: object
            properties:
