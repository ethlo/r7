$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: r7 Gateway Configuration
$defs:
  filter:
    oneOf:
      - type: object
        properties:
          RemoveQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific query parameter from the upstream request.
          CircuitBreaker:
            type: object
            properties:
              failure_threshold:
                type: integer
                description: The number of consecutive failures before the circuit opens.
              cooldown_period:
                type: string
                pattern: "^[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms)"
                description: "The duration the circuit remains open before attempting\
                \ to close. (Format: <number><unit> (e.g., 2s, 5m, 100ms))"
            required:
              - failure_threshold
              - cooldown_period
            additionalProperties: false
            description: Stops forwarding traffic to a failing upstream until it recovers.
          RemoveRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific header from the upstream request.
          RemoveRequestCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific cookie from the upstream request.
          InjectBasicAuth:
            type: object
            properties:
              password:
                type: string
                description: The password for Basic Auth.
              username:
                type: string
                description: The username for Basic Auth.
            required:
              - username
              - password
            additionalProperties: false
            description: Injects a Basic Authentication header into the upstream request.
          SetQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a query parameter in the upstream request.
          RequireMatchRequestHeader:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression pattern the header value must match.
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the header is missing
                  or invalid.
                default: 400
              name:
                type: string
                description: The name of the header.
            required:
              - name
              - regexp
              - reject_status_code
            additionalProperties: false
            description: Ensures a required request header exists and matches a specific
              regular expression.
          AddQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The value to assign to the query parameter.
            required:
              - name
              - value
            additionalProperties: false
            description: Injects a static query parameter into the upstream request
              URL.
          RewritePath:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression to match against the path.
              replacement:
                type: string
                description: "The replacement string, supporting capture group references\
                \ (e.g., $1)."
            required:
              - regexp
              - replacement
            additionalProperties: false
            description: Rewrites the request path using a regular expression replacement.
          SetStatus:
            type: object
            properties:
              status:
                type: integer
                description: The HTTP status code to set (100-599).
            required:
              - status
            additionalProperties: false
            description: Overwrites the HTTP status code of the client response.
          SetRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a header in the upstream request.
          ReturnResponse:
            type: object
            properties:
              content_type:
                type: string
                description: The Content-Type of the response body.
                default: text/plain
              body:
                type: string
                description: The body content of the response.
              status:
                type: integer
                description: The HTTP status code to return.
            required:
              - status
              - body
            additionalProperties: false
            description: Immediately terminates the request chain and returns a custom
              response.
          RequestSizeLimit:
            type: object
            properties:
              max_size:
                type: string
                pattern: "^[0-9]+\\s*(B|KB|MB|GB|TB|b|kb|mb|gb|tb)$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 10KB, 200MB)"
                description: "The maximum allowed payload size (e.g., 10MB, 1GB). (Format:\
                \ <number><unit> (e.g., 10KB, 200MB))"
            required:
              - max_size
            additionalProperties: false
            description: Rejects requests that exceed a specified payload size.
          SetResponseCookie:
            type: object
            properties:
              max_age:
                type: string
                pattern: "^[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms)"
                description: "The cookie max-age duration. (Format: <number><unit> (e.g.,\
                \ 2s, 5m, 100ms))"
              path:
                type: string
                description: The cookie path.
              same_site:
                type: string
                description: "The SameSite policy (Strict, Lax, None)."
              http_only:
                type: boolean
                description: Whether the cookie is HttpOnly.
              domain:
                type: string
                description: The cookie domain.
              name:
                type: string
                description: The cookie name.
              secure:
                type: boolean
                description: Whether the cookie is secure.
              value:
                type: string
                description: The cookie value.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets a Set-Cookie header on the client response.
          RequireMatchQueryParameter:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression pattern the query parameter value
                  must match.
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the parameter is missing
                  or invalid.
                default: 400
              name:
                type: string
                description: The name of the query parameter.
            required:
              - name
              - regexp
              - reject_status_code
            additionalProperties: false
            description: Ensures a required query parameter exists and matches a specific
              regular expression.
          RequireQueryParameter:
            type: object
            properties:
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the parameter is missing.
                default: 400
              name:
                type: string
                description: The name of the required query parameter.
            required:
              - name
              - reject_status_code
            additionalProperties: false
            description: Ensures a required query parameter is present in the request.
          SetResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a header in the client response.
          RequireCookie:
            type: object
            properties:
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the cookie is missing.
                default: 400
              name:
                type: string
                description: The name of the required cookie.
            required:
              - name
              - reject_status_code
            additionalProperties: false
            description: Ensures a required cookie is present in the request.
          Cors:
            type: object
            properties:
              max_age:
                type: string
                description: The max age for preflight caching.
              allowed_methods:
                type: string
                description: Comma-separated list of allowed methods.
              allowed_headers:
                type: string
                description: Comma-separated list of allowed headers.
              allow_credentials:
                type: boolean
                description: Whether credentials are allowed.
              allowed_origins:
                type: string
                description: Comma-separated list of allowed origins.
            required:
              - allowed_origins
              - allowed_methods
              - allowed_headers
              - max_age
              - allow_credentials
            additionalProperties: false
            description: Handles Cross-Origin Resource Sharing (CORS) preflight and
              response headers.
          RateLimiter:
            type: object
            properties:
              refill_period:
                type: string
                pattern: "^[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms)"
                description: "The time interval between token refills (e.g., 1s, 500ms).\
                \ (Format: <number><unit> (e.g., 2s, 5m, 100ms))"
              max_bucket_ttl:
                type: string
                pattern: "^[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms)"
                description: "How long a bucket remains in memory after its last access\
                \ before being purged. (Format: <number><unit> (e.g., 2s, 5m, 100ms))"
                default: 10m
              max_buckets:
                type: integer
                description: The maximum number of distinct client buckets to track
                  in memory. Limits memory consumption under heavy load.
                default: 100000
              capacity:
                type: integer
                description: The maximum number of tokens the bucket can hold. This
                  defines the absolute burst limit.
              refill_tokens:
                type: integer
                description: The number of tokens added to the bucket at the end of
                  every refill period.
            required:
              - capacity
              - refill_tokens
              - refill_period
            additionalProperties: false
            description: Local rate-limiter useful for avoiding overload by demanding
              users
          AddResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value of the header.
            required:
              - name
              - value
            additionalProperties: false
            description: Adds a custom header to the client response.
          TemplateRedirect:
            type: object
            properties:
              source:
                type: string
                description: The regular expression pattern to match against the request
                  path.
              target:
                type: string
                description: "The replacement template for the target URL (e.g., /new/$1)."
              status:
                type: integer
                description: The HTTP status code to return for the redirect.
                default: 302
            required:
              - source
              - target
              - status
            additionalProperties: false
            description: Redirects requests based on a path pattern match using a template
              for the target URL.
          RequireRequestHeader:
            type: object
            properties:
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the header is missing.
                default: 400
              name:
                type: string
                description: The name of the required header.
            required:
              - name
              - reject_status_code
            additionalProperties: false
            description: Ensures a required header is present in the request.
          RequireMatchCookie:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression pattern the cookie value must match.
              reject_status_code:
                type: integer
                description: The HTTP status code to return if the cookie is missing
                  or invalid.
                default: 400
              name:
                type: string
                description: The name of the cookie.
            required:
              - name
              - regexp
              - reject_status_code
            additionalProperties: false
            description: Ensures a required cookie exists and matches a specific regular
              expression.
          StaticContent:
            type: object
            properties:
              base_directory:
                type: object
                additionalProperties: true
                description: The absolute path to the directory containing static files.
            required:
              - base_directory
            additionalProperties: false
            description: Serves static files from a local directory.
          SetRequestCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              value:
                type: string
                description: The value of the cookie.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets a cookie on the upstream request.
          AddRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value of the header.
            required:
              - name
              - value
            additionalProperties: false
            description: Adds a custom header to the upstream request.
          RemoveResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific header from the client response.
          StripPathPrefix:
            type: object
            properties:
              parts:
                type: integer
                description: The number of path segments to strip from the beginning
                  of the path.
            required:
              - parts
            additionalProperties: false
            description: Removes a specified number of leading path segments from the
              request path before forwarding to the upstream service.
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
      - type: string
        enum:
          - AddCorrelationId
          - RemoveCacheHeaders
          - RequireAuthorizationHeader
  predicate:
    oneOf:
      - type: object
        properties:
          Cookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              value:
                type: string
                description: The exact value the cookie must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if a request contains a specific cookie with an exact
              value.
          Path:
            type: object
            properties:
              path:
                type: string
                description: The exact path to match.
            required:
              - path
            additionalProperties: false
            description: Matches if the request path matches exactly the provided path.
          QueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The exact value the query parameter must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if the request contains the specified query parameter
              with an exact value.
          or:
            type: array
            items:
              $ref: "#/$defs/predicate"
          MatchPath:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression to match against the request path.
            required:
              - regexp
            additionalProperties: false
            description: Matches the request path against a regular expression.
          MatchRequestHeader:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression the header value must match.
              name:
                type: string
                description: The name of the header.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a request header exists and its value matches the
              provided regular expression.
          MatchCookie:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression the cookie value must match.
              name:
                type: string
                description: The name of the cookie.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a cookie exists and its value matches the provided
              regular expression.
          MatchQueryParameter:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression the parameter value must match.
              name:
                type: string
                description: The name of the query parameter.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a query parameter exists and its value matches the
              provided regular expression.
          Host:
            type: object
            properties:
              hosts:
                type: array
                items:
                  type: string
                description: List of hostnames to match against.
            required:
              - hosts
            additionalProperties: false
            description: Matches if the request 'Host' header matches one of the provided
              hostnames.
          Method:
            type: object
            properties:
              include:
                type: array
                items:
                  type: string
                description: "List of allowed HTTP methods (e.g., GET, POST)."
            required:
              - include
            additionalProperties: false
            description: Matches if the HTTP method is one of the allowed methods.
          RemoteAddr:
            type: object
            properties:
              source:
                type: string
                description: "The IP or CIDR range to match (e.g., 192.168.1.0/24)."
            required:
              - source
            additionalProperties: false
            description: Matches if the remote IP address falls within the specified
              CIDR range.
          not:
            $ref: "#/$defs/predicate"
          HasRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified header, regardless\
            \ of its value."
          and:
            type: array
            items:
              $ref: "#/$defs/predicate"
          RequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the request header.
              value:
                type: string
                description: The exact value the header must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if the request contains the specified header with an
              exact value.
          HasQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified query parameter,\
            \ regardless of its value."
          HasCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie to check for.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified cookie, regardless\
            \ of its value."
          PathPrefix:
            type: object
            properties:
              prefix:
                type: string
                description: The path prefix to match.
            required:
              - prefix
            additionalProperties: false
            description: Matches if the request path starts with the provided prefix.
        additionalProperties: false
        minProperties: 1
        maxProperties: 1
  route:
    type: object
    properties:
      upstream:
        type: object
        properties:
          fallback:
            type: object
            properties:
              route_id:
                type: string
                description: The ID of another route to execute if this upstream becomes
                  completely unavailable.
            required:
              - route_id
            additionalProperties: false
            description: Fallback routing behavior triggered when all upstream targets
              fail.
          targets:
            type: array
            items:
              type: object
              properties:
                url:
                  type: string
                  pattern: ^https?://.*$
                  errorMessage:
                    pattern: URL must start with http:// or https://
                  description: The target URL (Must start with http:// or https://).
              required:
                - url
              additionalProperties: false
              description: An individual backend server.
            description: List of backend servers to forward traffic to.
          health_check:
            type: object
            properties:
              path:
                type: string
                pattern: ^/.*$
                errorMessage:
                  pattern: Path must start with a forward slash (/)
                description: "The URI path used to check the health of the target\
                  \ (e.g., /health)."
            required:
              - path
            additionalProperties: false
            description: Active health checking configuration for the backend targets.
        required:
          - targets
        additionalProperties: false
        description: Configuration for routing traffic to backend services.
      journal:
        type: object
        properties:
          request:
            type: object
            properties:
              status_overrides:
                type: object
                additionalProperties:
                  type: string
                description: "Overrides for the journal level based on specific HTTP\
                  \ status codes or classes (e.g., '5xx': 'FULL', '404': 'NONE')."
              level:
                type: string
                enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                description: The base journaling verbosity level.
            additionalProperties: false
            description: Journal settings for this specific phase of the exchange.
          response:
            type: object
            properties:
              status_overrides:
                type: object
                additionalProperties:
                  type: string
                description: "Overrides for the journal level based on specific HTTP\
                  \ status codes or classes (e.g., '5xx': 'FULL', '404': 'NONE')."
              level:
                type: string
                enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                description: The base journaling verbosity level.
            additionalProperties: false
            description: Journal settings for this specific phase of the exchange.
        additionalProperties: false
        description: Observability and logging configuration for this specific route.
      match:
        type: array
        items:
          $ref: "#/$defs/predicate"
        description: "Conditions that must be met for this route to handle a request.\
          \ If omitted, all requests match."
      id:
        type: string
        description: "A unique identifier for this route. Used for logging, metrics,\
          \ and fallback references."
      filters:
        type: array
        items:
          $ref: "#/$defs/filter"
        description: "A list of processing steps applied to the request before forwarding,\
          \ and to the response before returning."
    required:
      - id
    additionalProperties: false
    anyOf:
      - required:
          - upstream
      - required:
          - filters
    description: Defines a single traffic route and its associated behaviors.
properties:
  routes:
    type: array
    items:
      $ref: "#/$defs/route"
    description: The routing table defining how incoming traffic is matched and forwarded.
  global_filters:
    type: array
    items:
      $ref: "#/$defs/filter"
    description: A list of filters applied globally to every request passing through
      the gateway.
