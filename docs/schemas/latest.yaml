                description: "Maximum time to wait for a response after sending the request. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
                default: 30s
            additionalProperties: false
        additionalProperties: false
        description: "Upstream keys the group's routes inherit, each unless the route names it; keys not named here are inherited from the root."
