                request:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - NONE
                      - HEADERS
                      - METADATA
                      description: "The journaling verbosity level. FULL cannot be set once the response is decided: the request body has already streamed."
                  additionalProperties: false
                  minProperties: 1
                  description: Journal settings for this direction of the exchange.
                response:
                  type: object
                  properties:
                    level:
                      type: string
                      enum:
                      - NONE
                      - HEADERS
                      - METADATA
                      - FULL
