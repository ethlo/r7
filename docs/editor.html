<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>r7 Gateway Configurator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.46.0/min/vs/editor/editor.main.min.css">
    <style>
        body, html { height: 100%; margin: 0; }
        #container { height: 100vh; width: 100vw; }
    </style>
</head>
<body>

<div id="container"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.46.0/min/vs/loader.min.js"></script>
<script>
    require.config({ paths: { 'vs': 'https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.46.0/min/vs' }});

    require(['vs/editor/editor.main'], function() {
        // Configure JSON Schema validation for YAML
        monaco.languages.yaml.yamlDefaults.setDiagnosticsOptions({
            validate: true,
            enableSchemaRequest: true,
            hover: true,
            completion: true,
            schemas: [{
                uri: "https://r7.ethlo.com/schemas/latest.yaml",
                fileMatch: ["*"], // Apply this schema to the open file
            }]
        });

        // Initialize Editor
        const editor = monaco.editor.create(document.getElementById('container'), {
            value: "routes:\n  - id: my-route\n    upstream:\n      targets:\n        - url: http://localhost:8080",
            language: 'yaml',
            theme: 'vs-dark',
            automaticLayout: true
        });
    });
</script>
</body>
</html>
