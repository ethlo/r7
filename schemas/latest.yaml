$schema: https://json-schema.org/draft/2020-12/schema
type: object
title: r7 Gateway Configuration
$defs:
  filter:
    anyOf:
      - type: object
        properties:
          AddQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The value to assign to the query parameter.
            required:
              - name
              - value
            additionalProperties: false
            description: Injects a static query parameter into the upstream request URL.
          AddRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value of the header.
            required:
              - name
              - value
            additionalProperties: false
            description: Adds a custom header to the upstream request.
          AddResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value of the header.
            required:
              - name
              - value
            additionalProperties: false
            description: Adds a custom header to the client response.
          CircuitBreaker:
            type: object
            properties:
              cooldown_period:
                type: string
                pattern: '^(?:[0-9]+\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\$\{.*\})$'
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
                description: "The duration the circuit remains open before attempting to close. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
              failure_threshold:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The number of consecutive failures before the circuit opens.
            required:
              - failure_threshold
              - cooldown_period
            additionalProperties: false
            description: Stops forwarding traffic to a failing upstream until it recovers.
          Cors:
            type: object
            properties:
              allow_credentials:
                anyOf:
                  - type: boolean
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: Whether credentials are allowed.
              allowed_headers:
                type: string
                description: Comma-separated list of allowed headers.
              allowed_methods:
                type: string
                description: Comma-separated list of allowed methods.
              allowed_origins:
                type: string
                description: Comma-separated list of allowed origins.
              max_age:
                type: string
                description: The max age for preflight caching.
            required:
              - allowed_origins
              - allowed_methods
              - allowed_headers
              - max_age
              - allow_credentials
            additionalProperties: false
            description: Handles Cross-Origin Resource Sharing (CORS) preflight and response headers.
          InjectBasicAuth:
            type: object
            properties:
              password:
                type: string
                description: The password for Basic Auth.
              username:
                type: string
                description: The username for Basic Auth.
            required:
              - username
              - password
            additionalProperties: false
            description: Injects a Basic Authentication header into the upstream request.
          RateLimiter:
            type: object
            properties:
              capacity:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The maximum number of tokens the bucket can hold. This defines the absolute burst limit.
              max_bucket_ttl:
                type: string
                pattern: '^(?:[0-9]+\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\$\{.*\})$'
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
                description: "How long a bucket remains in memory after its last access before being purged. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
                default: 10m
              max_buckets:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The maximum number of distinct client buckets to track in memory. Limits memory consumption under heavy load.
                default: 100000
              refill_period:
                type: string
                pattern: "^(?:[0-9]+\\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\\$\\{.*\\})$"
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
                description: "The time interval between token refills (e.g., 1s, 500ms). (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
              refill_tokens:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The number of tokens added to the bucket at the end of every refill period.
            required:
              - capacity
              - refill_tokens
              - refill_period
            additionalProperties: false
            description: Local rate-limiter useful for avoiding overload by demanding users
          RemoveQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific query parameter from the upstream request.
          RemoveRequestCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific cookie from the upstream request.
          RemoveRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific header from the upstream request.
          RemoveResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header to remove.
            required:
              - name
            additionalProperties: false
            description: Removes a specific header from the client response.
          RequestSizeLimit:
            type: object
            properties:
              max_size:
                type: string
                pattern: '^(?:[0-9]+\s*(B|KB|MB|GB|TB|b|kb|mb|gb|tb)|\$\{.*\})$'
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 10KB, 200MB) or a placeholder ${...}"
                description: "The maximum allowed payload size (e.g., 10MB, 1GB). (Format: <number><unit> (e.g., 10KB, 200MB) or a placeholder ${...})"
            required:
              - max_size
            additionalProperties: false
            description: Rejects requests that exceed a specified payload size.
          RequireCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the required cookie.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the cookie is missing.
                default: 400
            required:
              - name
            additionalProperties: false
            description: Ensures a required cookie is present in the request.
          RequireMatchCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              regexp:
                type: string
                description: The regular expression pattern the cookie value must match.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the cookie is missing or invalid.
                default: 400
            required:
              - name
              - regexp
            additionalProperties: false
            description: Ensures a required cookie exists and matches a specific regular expression.
          RequireMatchQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              regexp:
                type: string
                description: The regular expression pattern the query parameter value must match.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the parameter is missing or invalid.
                default: 400
            required:
              - name
              - regexp
            additionalProperties: false
            description: Ensures a required query parameter exists and matches a specific regular expression.
          RequireMatchRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              regexp:
                type: string
                description: The regular expression pattern the header value must match.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the header is missing or invalid.
                default: 400
            required:
              - name
              - regexp
            additionalProperties: false
            description: Ensures a required request header exists and matches a specific regular expression.
          RequireQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the required query parameter.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the parameter is missing.
                default: 400
            required:
              - name
            additionalProperties: false
            description: Ensures a required query parameter is present in the request.
          RequireRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the required header.
              reject_status_code:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return if the header is missing.
                default: 400
            required:
              - name
            additionalProperties: false
            description: Ensures a required header is present in the request.
          ReturnResponse:
            type: object
            properties:
              body:
                type: string
                description: The body content of the response.
              content_type:
                type: string
                description: The Content-Type of the response body.
                default: text/plain
              status:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return.
            required:
              - status
              - body
            additionalProperties: false
            description: Immediately terminates the request chain and returns a custom response.
          RewritePath:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression to match against the path.
              replacement:
                type: string
                description: "The replacement string, supporting capture group references (e.g., $1)."
            required:
              - regexp
              - replacement
            additionalProperties: false
            description: Rewrites the request path using a regular expression replacement.
          SetQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a query parameter in the upstream request.
          SetRequestCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              value:
                type: string
                description: The value of the cookie.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets a cookie on the upstream request.
          SetRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a header in the upstream request.
          SetResponseCookie:
            type: object
            properties:
              domain:
                type: string
                description: The cookie domain.
              http_only:
                anyOf:
                  - type: boolean
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: Whether the cookie is HttpOnly.
              max_age:
                type: string
                pattern: '^(?:[0-9]+\s*(ns|us|ms|s|m|h|d|NS|US|MS|S|M|H|D)|\$\{.*\})$'
                errorMessage:
                  pattern: "Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...}"
                description: "The cookie max-age duration. (Format: <number><unit> (e.g., 2s, 5m, 100ms) or a placeholder ${...})"
              name:
                type: string
                description: The cookie name.
              path:
                type: string
                description: The cookie path.
              same_site:
                type: string
                description: "The SameSite policy (Strict, Lax, None)."
              secure:
                anyOf:
                  - type: boolean
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: Whether the cookie is secure.
              value:
                type: string
                description: The cookie value.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets a Set-Cookie header on the client response.
          SetResponseHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              value:
                type: string
                description: The value to set.
            required:
              - name
              - value
            additionalProperties: false
            description: Sets (or overwrites) a header in the client response.
          SetStatus:
            type: object
            properties:
              status:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to set (100-599).
            required:
              - status
            additionalProperties: false
            description: Overwrites the HTTP status code of the client response.
          StaticContent:
            type: object
            properties:
              base_directory:
                type: string
                description: The absolute path to the directory containing static files.
            required:
              - base_directory
            additionalProperties: false
            description: Serves static files from a local directory.
          StripPathPrefix:
            type: object
            properties:
              parts:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The number of path segments to strip from the beginning of the path.
            required:
              - parts
            additionalProperties: false
            description: Removes a specified number of leading path segments from the request path before forwarding to the upstream service.
          TemplateRedirect:
            type: object
            properties:
              source:
                type: string
                description: The regular expression pattern to match against the request path.
              status:
                anyOf:
                  - type: integer
                  - type: string
                    pattern: '^\$\{.*\}$'
                description: The HTTP status code to return for the redirect.
                default: 302
              target:
                type: string
                description: "The replacement template for the target URL (e.g., /new/$1)."
            required:
              - source
              - target
            additionalProperties: false
            description: Redirects requests based on a path pattern match using a template for the target URL.
        additionalProperties: true
        minProperties: 1
        maxProperties: 1
      - type: string
        enum:
          - AddCorrelationId
          - RemoveCacheHeaders
          - RequireAuthorizationHeader
      - type: string
        description: Custom SPI implementation
  predicate:
    anyOf:
      - type: object
        properties:
          Cookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              value:
                type: string
                description: The exact value the cookie must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if a request contains a specific cookie with an exact value.
          HasCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie to check for.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified cookie, regardless of its value."
          HasQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified query parameter, regardless of its value."
          HasRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
            required:
              - name
            additionalProperties: false
            description: "Matches if a request contains the specified header, regardless of its value."
          Host:
            type: object
            properties:
              hosts:
                type: array
                items:
                  type: string
                description: List of hostnames to match against.
            required:
              - hosts
            additionalProperties: false
            description: Matches if the request 'Host' header matches one of the provided hostnames.
          MatchCookie:
            type: object
            properties:
              name:
                type: string
                description: The name of the cookie.
              regexp:
                type: string
                description: The regular expression the cookie value must match.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a cookie exists and its value matches the provided regular expression.
          MatchPath:
            type: object
            properties:
              regexp:
                type: string
                description: The regular expression to match against the request path.
            required:
              - regexp
            additionalProperties: false
            description: Matches the request path against a regular expression.
          MatchQueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              regexp:
                type: string
                description: The regular expression the parameter value must match.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a query parameter exists and its value matches the provided regular expression.
          MatchRequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the header.
              regexp:
                type: string
                description: The regular expression the header value must match.
            required:
              - name
              - regexp
            additionalProperties: false
            description: Matches if a request header exists and its value matches the provided regular expression.
          Method:
            type: object
            properties:
              include:
                type: array
                items:
                  type: string
                description: "List of allowed HTTP methods (e.g., GET, POST)."
            required:
              - include
            additionalProperties: false
            description: Matches if the HTTP method is one of the allowed methods.
          Path:
            type: object
            properties:
              path:
                type: string
                pattern: "^(?:/.*|\\$\\{.*\\})$"
                errorMessage:
                  pattern: "Must match expected format or be a placeholder ${...}"
                description: The exact path to match.
            required:
              - path
            additionalProperties: false
            description: Matches if the request path matches exactly the provided path.
          PathPrefix:
            type: object
            properties:
              prefix:
                type: string
                pattern: '^(?:/.*|\$\{.*\})$'
                errorMessage:
                  pattern: "Must match expected format or be a placeholder ${...}"
                description: The path prefix to match.
            required:
              - prefix
            additionalProperties: false
            description: Matches if the request path starts with the provided prefix.
          QueryParameter:
            type: object
            properties:
              name:
                type: string
                description: The name of the query parameter.
              value:
                type: string
                description: The exact value the query parameter must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if the request contains the specified query parameter with an exact value.
          RemoteAddr:
            type: object
            properties:
              source:
                type: string
                description: "The IP or CIDR range to match (e.g., 192.168.1.0/24)."
            required:
              - source
            additionalProperties: false
            description: Matches if the remote IP address falls within the specified CIDR range.
          RequestHeader:
            type: object
            properties:
              name:
                type: string
                description: The name of the request header.
              value:
                type: string
                description: The exact value the header must hold.
            required:
              - name
              - value
            additionalProperties: false
            description: Matches if the request contains the specified header with an exact value.
          and:
            type: array
            items:
              $ref: "#/$defs/predicate"
          not:
            $ref: "#/$defs/predicate"
          or:
            type: array
            items:
              $ref: "#/$defs/predicate"
        additionalProperties: true
        minProperties: 1
        maxProperties: 1
      - type: string
        description: Custom SPI implementation
  route:
    type: object
    properties:
      filters:
        type: array
        items:
          $ref: "#/$defs/filter"
        description: "A list of processing steps applied to the request before forwarding, and to the response before returning."
      id:
        type: string
        description: "A unique identifier for this route. Used for logging, metrics, and fallback references."
      journal:
        type: object
        properties:
          request:
            type: object
            properties:
              status_overrides:
                type: object
                additionalProperties:
                  type: string
                description: "Overrides for the journal level based on specific HTTP status codes or classes (e.g., '5xx': 'FULL', '404': 'NONE')."
              level:
                type: string
                enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                description: The base journaling verbosity level.
            additionalProperties: false
            description: Journal settings for this specific phase of the exchange.
          response:
            type: object
            properties:
              status_overrides:
                type: object
                additionalProperties:
                  type: string
                description: "Overrides for the journal level based on specific HTTP status codes or classes (e.g., '5xx': 'FULL', '404': 'NONE')."
              level:
                type: string
                enum:
                  - NONE
                  - HEADERS
                  - METADATA
                  - FULL
                description: The base journaling verbosity level.
            additionalProperties: false
            description: Journal settings for this specific phase of the exchange.
        additionalProperties: false
        description: Observability and logging configuration for this specific route.
      match:
        type: array
        items:
          $ref: "#/$defs/predicate"
        description: "Conditions that must be met for this route to handle a request. If omitted, all requests match."
      upstream:
        type: object
        properties:
          fallback:
            type: object
            properties:
              route_id:
                type: string
                description: The ID of another route to execute if this upstream becomes completely unavailable.
            required:
              - route_id
            additionalProperties: false
            description: Fallback routing behavior triggered when all upstream targets fail.
          health_check:
            type: object
            properties:
              path:
                type: string
                pattern: '^/.*$'
                errorMessage:
                  pattern: Path must start with a forward slash (/)
                description: "The URI path used to check the health of the target (e.g., /health)."
            required:
              - path
            additionalProperties: false
            description: Active health checking configuration for the backend targets.
          targets:
            type: array
            items:
              type: object
              properties:
                url:
                  type: string
                  pattern: '^https?://.*$'
                  errorMessage:
                    pattern: URL must start with http:// or https://
                  description: The target URL (Must start with http:// or https://).
              required:
                - url
              additionalProperties: false
              description: An individual backend server.
            description: List of backend servers to forward traffic to.
        required:
          - targets
        additionalProperties: false
        description: Configuration for routing traffic to backend services.
    required:
      - id
    additionalProperties: false
    anyOf:
      - required:
          - upstream
      - required:
          - filters
    description: Defines a single traffic route and its associated behaviors.
properties:
  global_filters:
    type: array
    items:
      $ref: "#/$defs/filter"
    description: A list of filters applied globally to every request passing through the gateway.
  routes:
    type: array
    items:
      $ref: "#/$defs/route"
    description: The routing table defining how incoming traffic is matched and forwarded.
